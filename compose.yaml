services:
  aiflow-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiflow-studio:0.1.0
    container_name: aiflow-studio
    restart: unless-stopped
    init: true
    ports:
      - "14590:14590"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 14590
      AIWANAI_BASE_URL: https://ai.aiwanai.com.cn/v1
      AIWANAI_CHAT_BASE_URL: https://ai.aiwanai.com.cn/v1
      AIWANAI_IMAGE_BASE_URL: https://ai.aiwanai.com.cn/v1
      AIWANAI_DEFAULT_CHAT_MODEL: gpt-5.4-mini
      AIWANAI_IMAGE_MODEL: gpt-image-2-count
      IMAGE_DEMO_FALLBACK: "false"
      ALLOW_PRIVATE_MODEL_BASE_URL: "false"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
